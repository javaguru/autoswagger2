# .github/workflows/tests.yml
name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r autoswagger2/tests/requirements-dev.txt
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 autoswagger2 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Type check with mypy
        run: |
          mypy autoswagger2 --ignore-missing-imports || true

      - name: Format check with black
        run: |
          black --check autoswagger2 || true

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
        run: |
          python -m pytest --cov=autoswagger2 --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
