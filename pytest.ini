# pytest.ini
[pytest]
testpaths = autoswagger2/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
addopts =
    --cov=autoswagger2
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    -v
    --strict-markers

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests

# Minimum version
minversion = 7.0
